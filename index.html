<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dan Hawkley</title>

  <meta
    name="description"
    content="Recent engineering objects, statements, repositories, and reports by Dan Hawkley."
  >

  <link rel="stylesheet" href="/styles/site.css">
  <link rel="stylesheet" href="/styles/news.css">

  <script defer src="/js/site-builder.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="avatar-links" aria-label="Featured links">
          <a href="https://climatereality.app" aria-label="Climate Reality">
            <img
              src="/images/avatar3.jpg"
              alt="Grandma Physics"
              class="avatar"
            >
          </a>

          <a href="https://danhawkley.dev" aria-label="Dan Hawkley home">
            <img
              src="/images/avatar.jpg"
              alt="Dan Hawkley near Boulder"
              class="avatar"
            >
          </a>

          <a href="/style.html" aria-label="Style and studio">
            <img
              src="/images/avatar2.jpg"
              alt="Landyachtz"
              class="avatar"
            >
          </a>
        </div>

        <div class="brand-text">
          <p class="name"><strong>Dan Hawkley</strong></p>
          <p class="tagline">Engineering statements with scientific intent.</p>
        </div>
      </div>

      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        🌙 Dark
      </button>
    </div>
  </header>

  <main class="news-main">
    <header class="news-header">
      <p class="eyebrow">Recent engineering</p>
      <h1>Latest projects</h1>
    </header>

    <section
      id="latest-projects"
      class="project-feed"
      aria-live="polite"
      aria-busy="true"
    >
      <p class="feed-message">Loading recent engineering objects…</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Admissible generalizations trail leading specifications.</p>
    </div>
  </footer>
</body>
</html>
