<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dan Hawkley</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: #fff;
      color: #111;
    }

    header {
      padding: 1rem;
      border-bottom: 1px solid #ddd;
    }

    header nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    section {
      min-width: 0;
      min-height: 50vh;
      padding: 1.5rem;
      border-right: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
    }

    h2 {
      margin-top: 0;
      font-size: 1rem;
    }

    .text,
    .grok {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .grok {
      margin-top: 1.25rem;
      color: #555;
    }

    .source {
      display: inline-block;
      margin-top: 1rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button {
      font: inherit;
      padding: .4rem .7rem;
      background: transparent;
      border: 1px solid #aaa;
      border-radius: .35rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: .3;
      cursor: default;
    }

    .count {
      font-size: .85rem;
      color: #666;
    }

    @media (max-width: 700px) {
      main {
        grid-template-columns: 1fr;
      }

      section {
        min-height: auto;
        border-right: 0;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="https://antiviolence.ai">antiviolence.ai</a>
      <a href="https://antiviolentintelligence.ai">antiviolentintelligence.ai</a>
      <a href="https://repairearth.ai">repairearth.ai</a>
      <a href="https://translatepi.ai">translatepi.ai</a>
    </nav>
  </header>

  <main id="sections"></main>

  <script>
    const feeds = [
      {
        title: "antiviolence.ai",
        file: "/data/antiviolent.json"
      },
      {
        title: "antiviolentintelligence.ai",
        file: "/data/ai.json"
      },
      {
        title: "repairearth.ai",
        file: "/data/repairearth.json"
      },
      {
        title: "translatepi.ai",
        file: "/data/translatepi.json"
      }
    ];

    const container = document.getElementById("sections");

    feeds.forEach(createSection);

    async function createSection(feed) {
      const section = document.createElement("section");

      section.innerHTML = `
        <h2>${feed.title}</h2>

        <div class="item">
          <p>Loading…</p>
        </div>

        <div class="controls">
          <button class="previous" type="button">← Previous</button>
          <span class="count"></span>
          <button class="next" type="button">Next →</button>
        </div>
      `;

      container.appendChild(section);

      const item = section.querySelector(".item");
      const previous = section.querySelector(".previous");
      const next = section.querySelector(".next");
      const count = section.querySelector(".count");

      try {
        const response = await fetch(feed.file);

        if (!response.ok) {
          throw new Error(`Could not load ${feed.file}`);
        }

        const entries = await response.json();

        if (!entries.length) {
          item.innerHTML = "<p>No items.</p>";
          previous.disabled = true;
          next.disabled = true;
          return;
        }

        let index = 0;

        function render() {
          const entry = entries[index];

          item.innerHTML = "";

          const text = document.createElement("div");
          text.className = "text";
          text.textContent = entry.text || "";
          item.appendChild(text);

          if (entry.grok) {
            const grok = document.createElement("div");
            grok.className = "grok";
            grok.textContent = entry.grok;
            item.appendChild(grok);
          }

          if (entry.url) {
            const link = document.createElement("a");
            link.className = "source";
            link.href = entry.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "View post ↗";
            item.appendChild(link);
          }

          count.textContent = `${index + 1} / ${entries.length}`;

          previous.disabled = index === 0;
          next.disabled = index === entries.length - 1;
        }

        previous.addEventListener("click", () => {
          if (index > 0) {
            index--;
            render();
          }
        });

        next.addEventListener("click", () => {
          if (index < entries.length - 1) {
            index++;
            render();
          }
        });

        render();

      } catch (error) {
        item.textContent = error.message;
        previous.disabled = true;
        next.disabled = true;
      }
    }
  </script>

</body>
</html>
