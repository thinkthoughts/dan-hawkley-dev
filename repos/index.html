<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Repository Map | Dan Hawkley</title>

  <meta
    name="description"
    content="A map of active operating repositories, reference structures, and engineering evidence."
  >

  <link rel="stylesheet" href="/styles/site.css">

  <script defer src="/js/repo.js"></script>
</head>

<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="site-brand" href="/">danhawkley.dev</a>

      <div class="nav-links">
        <a href="/engineering/">Engineering</a>
        <a href="/roadmap/">Roadmap</a>
        <a href="/repos/" aria-current="page">Repositories</a>
        <a href="/reports/">Reports</a>

        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Toggle color theme"
        >
          Theme
        </button>
      </div>
    </nav>
  </header>

  <main class="site-main">
    <header class="page-header">
      <p class="eyebrow">Inventory</p>
      <h1>Repository Map</h1>

      <p class="page-introduction">
        Active operating repositories locate roadmaps, collaborations,
        reference structures, and engineering evidence.
      </p>
    </header>

    <section
      class="repository-controls"
      aria-label="Repository filters"
    >
      <label for="repository-search">Search repositories</label>

      <input
        id="repository-search"
        type="search"
        placeholder="Search names, descriptions, badges, or domains"
        autocomplete="off"
        data-repository-search
      >
    </section>

    <div
      class="repository-map"
      data-repositories-root
      aria-live="polite"
      aria-busy="true"
    >
      <p class="page-status">Loading repository map…</p>

      <noscript>
        <p>
          JavaScript is required to build the repository map from
          <code>/data/repos.json</code>.
        </p>
      </noscript>
    </div>
  </main>

  <footer class="site-footer">
    <p>Admissible generalizations trail leading specifications.</p>
  </footer>
</body>
</html>
